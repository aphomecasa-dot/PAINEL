<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" />
  <style>
    :root { --radius: 18px; --shadow: 0 0 20px #0008; }

    body {
      margin: 0;
      background: url(teste2.png) no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ── Temas de cor por background ── */
    body.cloudy-theme #clock,
    body.cloudy-theme #date,
    body.cloudy-theme #weather-description,
    body.cloudy-theme #weather-now,
    body.cloudy-theme #weather-icon,
    body.cloudy-theme #weather-now-day,
    body.cloudy-theme #usd,
    body.cloudy-theme #eur,
    body.cloudy-theme .day-row-name,
    body.cloudy-theme .day-row-icon,
    body.cloudy-theme .day-row-min,
    body.cloudy-theme .day-row-max {
      color: #0a1a3a !important;
    }
    body.cloudy-theme .day-row-bar-wrap {
      background: rgba(10,26,58,0.15) !important;
    }
    body.cloudy-theme .divider {
      background: rgba(10,26,58,0.2) !important;
    }
    body.cloudy-theme .top-info-bar {
      background: rgba(10,26,58,0.12) !important;
    }

    /* ── Canvas de chuva ── */
    #top-rain-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
      border-radius: var(--radius);
    }

    /* ── Layout principal ── */
    .layout {
      padding: 25px;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: stretch;
    }

    .top {
      display: flex;
      flex-direction: column;
      width: 100%;
      background: transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: background 0.8s ease;
    }
    .top.rain-overlay { background: rgba(0,0,0,0.30); }

    /* ══════════════════════════════════════════
       BARRA SUPERIOR: clima + câmbio
    ══════════════════════════════════════════ */
    .top-info-bar {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 14px 30px 10px 30px;
      box-sizing: border-box;
      background: rgba(0,0,0,0.10);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .info-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #weather-icon    { font-size: 76px; line-height: 1; }
    #weather-now     { font-size: 76px; font-weight: 700; line-height: 1; }
    #weather-now-day { font-size: 44px; font-weight: 600; opacity: 0.85; }
    #weather-description { font-size: 44px; font-weight: 600; }

    .info-bar-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #currency-section { font-size: 44px; display: flex; gap: 36px; }

    /* ══════════════════════════════════════════
       RELÓGIO — ocupa toda a largura
    ══════════════════════════════════════════ */
    .col-clock {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 30px;
      box-sizing: border-box;
      flex: 1;
      min-height: 0;
    }
    #clock {
      font-size: clamp(90px, 18vw, 340px);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: -2px;
    }
    #date {
      font-size: 56px;
      font-weight: 700;
      margin-top: 4px;
      text-transform: uppercase;
      text-align: center;
      opacity: 0.9;
    }

    .chart-section {
      position: relative;
      z-index: 1;
      padding: 10px 20% 20px 20%;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.2);
      border-radius: 1px;
      margin-bottom: 14px;
    }

    #day-chart-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .day-row { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .day-row-name { font-size: 20px; font-weight: 700; color: #fff; width: 54px; flex-shrink: 0; }
    .day-row-icon { font-size: 26px; flex-shrink: 0; width: 32px; text-align: center; }
    .day-row-min  { font-size: 18px; color: rgba(255,255,255,0.65); width: 40px; text-align: right; flex-shrink: 0; }
    .day-row-bar-wrap { flex: 1; height: 12px; background: rgba(255,255,255,0.15); border-radius: 7px; position: relative; overflow: hidden; min-width: 40px; }
    .day-row-bar  { position: absolute; height: 100%; border-radius: 7px; }
    .day-row-max  { font-size: 20px; font-weight: 700; color: #fff; width: 42px; text-align: left; flex-shrink: 0; }

    /* Cores dos ícones do gráfico de previsão */
    .day-row-icon.icon-rain       { color: #7ecbff !important; }
    .day-row-icon.icon-clear      { color: #FFD700 !important; }
    .day-row-icon.icon-cloud      { color: rgba(255,255,255,0.75) !important; }
    .day-row-icon.icon-snow       { color: #cce8ff !important; }
    .day-row-icon.icon-fog        { color: rgba(255,255,255,0.55) !important; }
  </style>
</head>
<body>

<div class="layout">
  <div class="top">
    <canvas id="top-rain-canvas"></canvas>

    <!-- ① Barra de clima + câmbio acima da hora -->
    <div class="top-info-bar">
      <div class="info-bar-left">
        <span id="weather-icon" class="mdi"></span>
        <span id="weather-now">--°C</span>
        <span id="weather-now-day">--</span>
        <span id="weather-description">--</span>
      </div>
      <div class="info-bar-right">
        <div id="currency-section">
          <div id="usd">USD: --</div>
          <div id="eur">EUR: --</div>
        </div>
      </div>
    </div>

    <!-- ② Relógio ocupa toda a largura -->
    <div class="col-clock">
      <div id="clock">--:--:--</div>
      <div id="date">...</div>
    </div>

    <!-- ③ Gráfico de barras abaixo da hora -->
    <div class="chart-section">
      <div class="divider"></div>
      <div id="day-chart-wrap"></div>
    </div>

  </div>
</div>

<script>
  // ── Coordenadas: Rua Brentano 306, Vila Leopoldina, SP ──
  const LAT     = -23.5189;
  const LON     = -46.7334;
  const API_KEY = "a1914a0291e97791460f4558d57cf359";

  const DIAS_SEMANA_FULL = ['Domingo','Segunda-Feira','Terça-Feira','Quarta-Feira','Quinta-Feira','Sexta-Feira','Sábado'];
  const DIAS_ABREV       = ['Dom.','Seg.','Ter.','Qua.','Qui.','Sex.','Sáb.'];
  const MESES            = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

  // ══════════════════════════════════════════
  //  FUNDO DINÂMICO — dia/noite + limpo/nublado
  // ══════════════════════════════════════════
  const CLOUDY_KEYWORDS = [
    'nublado','nuvens','nevoeiro','encoberto','overcast','chuva','garoa','trovoada',
    'cloudy','clouds','fog','mist','haze','nebuloso','rain','drizzle','thunderstorm',
    'parcialmente nublado','partly cloudy','mostly cloudy','levemente nublado','algumas nuvens','few clouds'
  ];

  function isCloudyCondition(desc) {
    const l = (desc || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return CLOUDY_KEYWORDS.some(k => l.includes(k.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  }

  function isNighttime() {
    const h = new Date().getHours();
    return h >= 19 || h < 6;
  }

  function updateBackground(desc) {
    const cloudy = isCloudyCondition(desc);
    const night  = isNighttime();

    let img;
    if (night) {
      img = cloudy ? 'noitenublada.jpg' : 'noitelimpa.jpg';
    } else {
      img = cloudy ? 'nublado.jpg' : 'teste2.png';
    }

    document.body.style.backgroundImage = `url('${img}')`;

    if (cloudy && !night) {
      document.body.classList.add('cloudy-theme');
    } else {
      document.body.classList.remove('cloudy-theme');
    }
  }

  // ══════════════════════════════════════════
  //  MOTOR DE CHUVA
  // ══════════════════════════════════════════
  const DPR          = window.devicePixelRatio || 1;
  const RAIN_DENSITY = 0.9;
  const MAX_DROPS    = 300;

  const rainCanvases = [
    { id: 'top-rain-canvas', el: null, ctx: null, w: 0, h: 0 }
  ];

  const eng = {
    drops: {}, splashes: {},
    lastTime: performance.now(), running: false, active: false
  };

  rainCanvases.forEach(c => {
    eng.drops[c.id]    = [];
    eng.splashes[c.id] = [];
  });

  function initRainCanvases() {
    rainCanvases.forEach(c => {
      c.el  = document.getElementById(c.id);
      if (!c.el) return;
      c.ctx = c.el.getContext('2d');
    });
    resizeRain();
    window.addEventListener('resize', resizeRain);
  }

  function resizeRain() {
    rainCanvases.forEach(c => {
      if (!c.el) return;
      const parent = c.el.parentElement;
      const w = Math.max(1, Math.floor(parent ? parent.offsetWidth  : window.innerWidth));
      const h = Math.max(1, Math.floor(parent ? parent.offsetHeight : window.innerHeight));
      c.el.width  = Math.floor(w * DPR);
      c.el.height = Math.floor(h * DPR);
      c.el.style.width  = w + 'px';
      c.el.style.height = h + 'px';
      c.w = c.el.width;
      c.h = c.el.height;
      c.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (eng.active) {
        seedDrops(c.id, Math.floor(Math.min(MAX_DROPS, 120 * RAIN_DENSITY * (w / 800))));
      }
    });
  }

  function mkDrop(cid, randomY = false) {
    const c = rainCanvases.find(x => x.id === cid);
    const w = c ? c.w / DPR : window.innerWidth;
    const h = c ? c.h / DPR : 600;
    const layer = Math.random();
    const speed = 350 + layer * 550;
    const angle = (-12 + Math.random() * 8) * (Math.PI / 180);
    return {
      x: Math.random() * (w + 100),
      y: randomY ? Math.random() * h : -20 - Math.random() * 100,
      vx: Math.sin(angle) * speed, vy: Math.cos(angle) * speed,
      ay: 80 + layer * 120, length: 10 + layer * 35,
      width: 0.8 + layer * 2.2, alpha: 0.18 + layer * 0.55, layer
    };
  }

  function seedDrops(cid, count) {
    const arr = eng.drops[cid];
    while (arr.length < count) arr.push(mkDrop(cid, true));
    while (arr.length > count) arr.pop();
  }

  function createSplash(x, y, cid) {
    const arr = eng.splashes[cid];
    const count = 4 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI + Math.random() * Math.PI;
      const speed = 40 + Math.random() * 120;
      arr.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 60,
        ay: 280, r: 1 + Math.random() * 2.5,
        alpha: 0.6 + Math.random() * 0.4, life: 1.0
      });
    }
  }

  function physicsStep(dt) {
    rainCanvases.forEach(c => {
      if (!c.el) return;
      const cw = c.w / DPR, ch = c.h / DPR;
      const drops = eng.drops[c.id];
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        d.vy += d.ay * dt; d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.y > ch + 5) {
          if (eng.active && Math.random() < 0.3) createSplash(d.x, ch, c.id);
          drops[i] = mkDrop(c.id, false);
        } else if (d.x < -60 || d.x > cw + 60) {
          drops[i] = mkDrop(c.id, false);
        }
      }
      const splashes = eng.splashes[c.id];
      for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        s.vx *= 0.92; s.vy += s.ay * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        s.life -= dt * 2.5;
        if (s.life <= 0) splashes.splice(i, 1);
      }
    });
  }

  function drawRain(ctx, c) {
    const drops = eng.drops[c.id];
    ctx.save(); ctx.lineCap = 'round';
    drops.forEach(d => {
      const angle = Math.atan2(d.vx, d.vy);
      const tx = d.x - Math.sin(angle) * d.length;
      const ty = d.y - Math.cos(angle) * d.length;
      const grad = ctx.createLinearGradient(tx, ty, d.x, d.y);
      grad.addColorStop(0, `rgba(174,214,241,0)`);
      grad.addColorStop(0.4, `rgba(174,214,241,${d.alpha * 0.4})`);
      grad.addColorStop(1, `rgba(255,255,255,${d.alpha})`);
      ctx.beginPath(); ctx.lineWidth = d.width; ctx.strokeStyle = grad;
      ctx.moveTo(tx, ty); ctx.lineTo(d.x, d.y); ctx.stroke();
    });
    eng.splashes[c.id].forEach(s => {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,230,255,${s.alpha * s.life})`; ctx.fill();
    });
    ctx.restore();
  }

  function drawFrame() {
    rainCanvases.forEach(c => {
      if (!c.ctx) return;
      c.ctx.clearRect(0, 0, c.w, c.h);
      if (eng.active) {
        c.ctx.save();
        c.ctx.beginPath();
        c.ctx.rect(0, 0, c.w / DPR, c.h / DPR);
        c.ctx.clip();
        drawRain(c.ctx, c);
        c.ctx.restore();
      }
    });
  }

  function startEngine() {
    if (eng.running) return;
    eng.running = true;
    eng.lastTime = performance.now();
    function step(now) {
      const dt = Math.min(0.05, (now - eng.lastTime) / 1000);
      eng.lastTime = now;
      physicsStep(dt);
      drawFrame();
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function isRainCondition(condition, weatherId) {
    const c = (condition || '').toLowerCase();
    const id = weatherId || 0;
    if (id >= 200 && id < 600) return true;
    return c.includes('rain') || c.includes('drizzle') || c.includes('thunderstorm');
  }

  function setRainEffect(condition, weatherId) {
    const isRain = isRainCondition(condition, weatherId);
    eng.active = isRain;
    const topEl = document.querySelector('.top');
    if (topEl) topEl.classList.toggle('rain-overlay', isRain);
    rainCanvases.forEach(c => {
      if (!c.el) return;
      if (isRain) {
        const w = c.w / DPR;
        const count = Math.floor(Math.min(MAX_DROPS, 160 * RAIN_DENSITY * (w / 800)));
        seedDrops(c.id, Math.max(80, count));
      } else {
        eng.drops[c.id]    = [];
        eng.splashes[c.id] = [];
      }
    });
  }

  // ══════════════════════════════════════════
  //  RELÓGIO — atualiza a cada segundo
  //  e reavalia o fundo na virada de hora
  // ══════════════════════════════════════════
  let lastHour = new Date().getHours();
  let currentWeatherDesc = '';

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
    document.getElementById('date').textContent =
      DIAS_SEMANA_FULL[now.getDay()] + ', ' +
      String(now.getDate()).padStart(2,'0') + ' ' +
      MESES[now.getMonth()];

    // Reavalia background quando a hora muda (ex: passa das 19h ou das 6h)
    const h = now.getHours();
    if (h !== lastHour) {
      lastHour = h;
      if (currentWeatherDesc) updateBackground(currentWeatherDesc);
    }
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ══════════════════════════════════════════
  //  ÍCONE
  // ══════════════════════════════════════════
  function weatherIcon(code) {
    const map = {
      'Clear':'mdi-weather-sunny','Clouds':'mdi-weather-cloudy',
      'Rain':'mdi-weather-rainy','Drizzle':'mdi-weather-partly-rainy',
      'Thunderstorm':'mdi-weather-lightning','Snow':'mdi-weather-snowy',
      'Mist':'mdi-weather-fog','Fog':'mdi-weather-fog','Haze':'mdi-weather-fog'
    };
    return map[code] || 'mdi-weather-cloudy';
  }

  // Classe de cor para ícone do gráfico
  function iconColorClass(code) {
    if (['Rain','Drizzle','Thunderstorm'].includes(code)) return 'icon-rain';
    if (code === 'Clear') return 'icon-clear';
    if (code === 'Snow')  return 'icon-snow';
    if (['Mist','Fog','Haze'].includes(code)) return 'icon-fog';
    return 'icon-cloud';
  }

  // ══════════════════════════════════════════
  //  COTAÇÃO
  // ══════════════════════════════════════════
  async function loadCurrency() {
    try {
      const res  = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
      const data = await res.json();
      const brl  = data.rates.BRL;
      const eur  = data.rates.EUR;
      document.getElementById('usd').textContent = `USD: R$ ${brl.toFixed(2)}`;
      document.getElementById('eur').textContent = `EUR: R$ ${(brl / eur).toFixed(2)}`;
    } catch(e) {
      document.getElementById('usd').textContent = 'USD: --';
      document.getElementById('eur').textContent = 'EUR: --';
    }
  }
  loadCurrency();
  setInterval(loadCurrency, 300000);

  // ══════════════════════════════════════════
  //  GRÁFICO DOS PRÓXIMOS 5 DIAS
  // ══════════════════════════════════════════
  function buildChart(dailyKeys, dailyMap) {
    const wrap = document.getElementById('day-chart-wrap');
    wrap.innerHTML = '';
    const allMins = dailyKeys.map(d => Math.min(...dailyMap[d].map(i => i.main.temp_min)));
    const allMaxs = dailyKeys.map(d => Math.max(...dailyMap[d].map(i => i.main.temp_max)));
    const globalMin = Math.min(...allMins);
    const globalMax = Math.max(...allMaxs);
    const range = globalMax - globalMin || 1;

    dailyKeys.forEach(d => {
      const items = dailyMap[d];
      const dMin  = Math.round(Math.min(...items.map(i => i.main.temp_min)));
      const dMax  = Math.round(Math.max(...items.map(i => i.main.temp_max)));
      const noon  = items.reduce((best, cur) => {
        const h = new Date(cur.dt * 1000).getHours();
        return Math.abs(h - 12) < Math.abs(new Date(best.dt * 1000).getHours() - 12) ? cur : best;
      });
      const ic        = weatherIcon(noon.weather[0].main);
      const icColor   = iconColorClass(noon.weather[0].main);
      let barColor = '#74b9ff';
      if (dMax >= 20 && dMax < 25) barColor = '#FFD700';
      if (dMax >= 25) barColor = '#FF8C00';

      const leftPct  = ((dMin - globalMin) / range * 80).toFixed(1);
      const widthPct = ((dMax - dMin)      / range * 80).toFixed(1);
      const dt       = new Date(d + 'T12:00:00');
      const dayName  = DIAS_ABREV[dt.getDay()];

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <div class="day-row-name">${dayName}</div>
        <span class="day-row-icon mdi ${ic} ${icColor}"></span>
        <div class="day-row-min">${dMin}°</div>
        <div class="day-row-bar-wrap">
          <div class="day-row-bar" style="left:${leftPct}%;width:${widthPct}%;background:linear-gradient(to right,${barColor}99,${barColor})"></div>
        </div>
        <div class="day-row-max">${dMax}°</div>
      `;
      wrap.appendChild(row);
    });
  }

  // ══════════════════════════════════════════
  //  CLIMA VIA API
  // ══════════════════════════════════════════
  async function loadWeather(attempt = 1) {
    try {
      const [resNow, resForecast] = await Promise.all([
        fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&units=metric&lang=pt_br&appid=${API_KEY}`),
        fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${LAT}&lon=${LON}&units=metric&lang=pt_br&appid=${API_KEY}`)
      ]);
      if (!resNow.ok || !resForecast.ok) throw new Error('HTTP error');

      const nowData      = await resNow.json();
      const forecastData = await resForecast.json();

      const temp        = Math.round(nowData.main.temp);
      const condition   = nowData.weather[0].main;
      const weatherId   = nowData.weather[0].id;
      const description = nowData.weather[0].description || '';
      const prettyDesc  = description.charAt(0).toUpperCase() + description.slice(1);

      // Guarda para reavaliação na virada de hora
      currentWeatherDesc = prettyDesc;

      document.getElementById('weather-now').textContent  = `${temp}°C`;
      document.getElementById('weather-description').textContent = prettyDesc;
      document.getElementById('weather-icon').className   = 'mdi ' + weatherIcon(condition);

      const nowDate = new Date();
      const dia = String(nowDate.getDate()).padStart(2,'0');
      const mes = nowDate.toLocaleDateString('pt-BR',{month:'short'}).toUpperCase().replace('.','');
      document.getElementById('weather-now-day').textContent = `${dia}-${mes}`;

      updateBackground(prettyDesc);
      setRainEffect(condition, weatherId);

      const todayStr = new Date().toISOString().slice(0,10);
      const dailyMap = {};
      forecastData.list.forEach(item => {
        const d = item.dt_txt.slice(0,10);
        if (!dailyMap[d]) dailyMap[d] = [];
        dailyMap[d].push(item);
      });
      const dailyKeys = Object.keys(dailyMap).filter(d => d > todayStr).slice(0,5);
      buildChart(dailyKeys, dailyMap);

    } catch(e) {
      console.error(`Erro loadWeather (tentativa ${attempt}):`, e);
      if (attempt < 4) {
        const delays = [5000, 15000, 30000];
        document.getElementById('weather-description').textContent = 'Reconectando...';
        setTimeout(() => loadWeather(attempt + 1), delays[attempt - 1]);
      } else {
        document.getElementById('weather-description').textContent = 'Sem conexão';
        setTimeout(() => loadWeather(1), 120000);
      }
    }
  }

  // ── Init ──
  window.addEventListener('load', () => {
    initRainCanvases();
    startEngine();
    loadWeather();
    setInterval(() => loadWeather(1), 300000);
  });
</script>
</body>
</html>
