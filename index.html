<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" />
  <style>
    :root { --radius: 18px; --shadow: 0 0 20px #0008; }
    body {
      margin: 0;
      background: url(teste2.png) no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }
    body.cloudy-theme #clock,
    body.cloudy-theme #date,
    body.cloudy-theme #weather-description,
    body.cloudy-theme #weather-now,
    body.cloudy-theme #weather-icon,
    body.cloudy-theme #weather-now-day,
    body.cloudy-theme #usd,
    body.cloudy-theme #eur,
    body.cloudy-theme .day-row-name,
    body.cloudy-theme .day-row-icon,
    body.cloudy-theme .day-row-min,
    body.cloudy-theme .day-row-max {
      color: #0a1a3a !important;
    }

    #bg-rain-canvas { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0; }

    .layout {
      padding: 25px;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: stretch;
    }

    .top {
      display: flex;
      flex-direction: row;
      width: 100%;
      background: transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    #top-rain-canvas {
      position:absolute;top:0;left:0;width:100%;height:100%;
      pointer-events:none;z-index:0;border-radius:var(--radius);
    }

    /* ── ESQUERDA: relógio ── */
    .col-clock {
      position: relative;
      z-index: 1;
      flex: 0 0 55%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 10px 20px 30px;
      box-sizing: border-box;
    }
    #clock {
      font-size: clamp(68px, 15vw, 285px);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }
    #date {
      font-size: 30px;
      font-weight: 700;
      margin-top: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    /* ── DIREITA: centralizada verticalmente ── */
    .col-right {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center; /* centraliza verticalmente */
      align-items: center;     /* centraliza horizontalmente */
      padding: 20px;
      box-sizing: border-box;
      gap: 12px;
    }

    /* CLIMA: centralizado */
    .weather-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
    }
    #weather-description { font-size: 26px; font-weight: 600; text-align: center; }
    .weather-temp-block { display: flex; align-items: center; gap: 6px; }
    #weather-icon { font-size: 52px; }
    #weather-now  { font-size: 52px; font-weight: 700; }
    #weather-now-day { font-size: 36px; font-weight: 700; white-space: nowrap; text-align: center; }
    #currency-section { font-size: 22px; display: flex; gap: 14px; justify-content: center; }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.2);
      border-radius: 1px;
    }

    /* GRÁFICO */
    #day-chart-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .day-row { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .day-row-name { font-size: 22px; font-weight: 700; color: #fff; width: 54px; flex-shrink: 0; }
    .day-row-icon { font-size: 28px; flex-shrink: 0; width: 34px; text-align: center; }
    .day-row-min { font-size: 20px; color: rgba(255,255,255,0.65); width: 42px; text-align: right; flex-shrink: 0; }
    .day-row-bar-wrap { flex: 1; height: 13px; background: rgba(255,255,255,0.15); border-radius: 7px; position: relative; overflow: hidden; min-width: 40px; }
    .day-row-bar { position: absolute; height: 100%; border-radius: 7px; }
    .day-row-max { font-size: 22px; font-weight: 700; color: #fff; width: 42px; text-align: left; flex-shrink: 0; }
  </style>
</head>
<body>
<canvas id="bg-rain-canvas"></canvas>
<div class="layout">
  <div class="top">
    <canvas id="top-rain-canvas"></canvas>

    <div class="col-clock">
      <div id="clock">--:--:--</div>
      <div id="date">...</div>
    </div>

    <div class="col-right">

      <div class="weather-block">
        <div id="weather-description">PARCIALMENTE NUBLADO</div>
        <div class="weather-temp-block">
          <span id="weather-icon" class="mdi mdi-weather-cloudy"></span>
          <span id="weather-now">22°C</span>
        </div>
        <span id="weather-now-day">07-MAI</span>
        <div id="currency-section">
          <div id="usd">USD: R$ 5,68</div>
          <div id="eur">EUR: R$ 6,17</div>
        </div>
      </div>

      <div class="divider"></div>

      <div id="day-chart-wrap"></div>

    </div>
  </div>
</div>

<script>
  const DIAS_SEMANA_FULL = ['Domingo','Segunda-Feira','Terça-Feira','Quarta-Feira','Quinta-Feira','Sexta-Feira','Sábado'];
  const DIAS_ABREV = ['Dom.','Seg.','Ter.','Qua.','Qui.','Sex.','Sáb.'];
  const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    const dia = String(now.getDate()).padStart(2,'0');
    const mes = MESES[now.getMonth()];
    document.getElementById('date').textContent = `${DIAS_SEMANA_FULL[now.getDay()]}, ${dia} ${mes}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  const forecastData = [
    { min: 18, max: 27, icon: 'mdi-weather-cloudy',       grad: ['#FFD70099','#FFD700'] },
    { min: 17, max: 23, icon: 'mdi-weather-rainy',         grad: ['#74b9ff99','#74b9ff'] },
    { min: 19, max: 31, icon: 'mdi-weather-sunny',         grad: ['#FF8C0099','#FF8C00'] },
    { min: 20, max: 28, icon: 'mdi-weather-partly-cloudy', grad: ['#90EE9099','#90EE90'] },
    { min: 21, max: 32, icon: 'mdi-weather-sunny',         grad: ['#FF8C0099','#FF8C00'] },
  ];

  function buildChart() {
    const wrap = document.getElementById('day-chart-wrap');
    wrap.innerHTML = '';
    const allMaxes = forecastData.map(d => d.max);
    const allMins  = forecastData.map(d => d.min);
    const globalMin = Math.min(...allMins);
    const globalMax = Math.max(...allMaxes);
    const range = globalMax - globalMin || 1;
    const today = new Date();

    forecastData.forEach((d, i) => {
      const dia = new Date(today);
      dia.setDate(today.getDate() + i + 1);
      const nomeDia = DIAS_ABREV[dia.getDay()];
      const leftPct  = ((d.min - globalMin) / range * 80).toFixed(1);
      const widthPct = ((d.max - d.min)     / range * 80).toFixed(1);

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <div class="day-row-name">${nomeDia}</div>
        <span class="day-row-icon mdi ${d.icon}"></span>
        <div class="day-row-min">${d.min}°</div>
        <div class="day-row-bar-wrap">
          <div class="day-row-bar" style="left:${leftPct}%;width:${widthPct}%;background:linear-gradient(to right,${d.grad[0]},${d.grad[1]})"></div>
        </div>
        <div class="day-row-max">${d.max}°</div>
      `;
      wrap.appendChild(row);
    });
  }
  buildChart();

  const CLOUDY_KEYWORDS = [
    'nublado','nuvens','nevoeiro','encoberto','overcast',
    'cloudy','clouds','fog','mist','haze','nebuloso',
    'parcialmente nublado','partly cloudy','mostly cloudy',
    'levemente nublado','algumas nuvens','few clouds'
  ];
  function isCloudyCondition(d) {
    const l = d.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return CLOUDY_KEYWORDS.some(k => l.includes(k.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  }
  function updateBackground(desc) {
    if (isCloudyCondition(desc)) {
      document.body.style.backgroundImage = "url('nublado.jpg')";
      document.body.classList.add('cloudy-theme');
    } else {
      document.body.style.backgroundImage = "url('teste2.png')";
      document.body.classList.remove('cloudy-theme');
    }
  }
  const weatherDesc = document.getElementById('weather-description');
  updateBackground(weatherDesc.textContent);
  new MutationObserver(() => updateBackground(weatherDesc.textContent))
    .observe(weatherDesc, { childList:true, characterData:true, subtree:true });
</script>
</body>
</html>
