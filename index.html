<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" />
  <style>
    :root {
      --radius: 18px;
      --shadow: 0 0 20px #0008;
    }
    body {
      margin: 0;
      background: url(teste2.png) no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }
    body.cloudy-theme { color: #0a1a3a; }
    body.cloudy-theme #clock,
    body.cloudy-theme #date,
    body.cloudy-theme #weather-description,
    body.cloudy-theme #weather-now,
    body.cloudy-theme #weather-icon,
    body.cloudy-theme #weather-now-day,
    body.cloudy-theme #usd,
    body.cloudy-theme #eur,
    body.cloudy-theme .day-row-name,
    body.cloudy-theme .day-row-icon,
    body.cloudy-theme .day-row-min,
    body.cloudy-theme .day-row-max {
      color: #0a1a3a !important;
    }

    #bg-rain-canvas { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0; }

    .layout {
      padding: 25px;
      height: 100vh;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: stretch;
    }

    .top {
      display: flex;
      flex-direction: row;
      width: 100%;
      background: transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    #top-rain-canvas {
      position: absolute;top:0;left:0;width:100%;height:100%;
      pointer-events:none;z-index:0;border-radius:var(--radius);
    }

    .col-clock {
      position: relative;
      z-index: 1;
      flex: 0 0 55%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 10px 20px 30px;
      box-sizing: border-box;
    }
    #clock {
      font-size: clamp(85px, 18.7vw, 357px); /* -15% */
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }
    #date {
      font-size: 36px;
      font-weight: 700;
      margin-top: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .col-right {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 20px 20px 10px;
      box-sizing: border-box;
      gap: 14px;
    }

    .weather-block {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    #weather-description { font-size: 22px; font-weight: 600; }
    .weather-temp-block { display: flex; align-items: center; gap: 8px; }
    #weather-icon { font-size: 44px; }
    #weather-now { font-size: 44px; font-weight: 700; }
    #weather-now-day { font-size: 32px; font-weight: 700; color: #fff; white-space: nowrap; }
    #currency-section { font-size: 18px; display: flex; gap: 16px; }

    #day-chart-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }
    .day-row { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .day-row-name { font-size: 24px; font-weight: 700; color: #fff; width: 58px; flex-shrink: 0; }
    .day-row-icon { font-size: 30px; flex-shrink: 0; width: 36px; text-align: center; }
    .day-row-min { font-size: 22px; color: rgba(255,255,255,0.65); width: 44px; text-align: right; flex-shrink: 0; }
    .day-row-bar-wrap { flex: 1; height: 14px; background: rgba(255,255,255,0.15); border-radius: 7px; position: relative; overflow: hidden; min-width: 40px; }
    .day-row-bar { position: absolute; height: 100%; border-radius: 7px; }
    .day-row-max { font-size: 24px; font-weight: 700; color: #fff; width: 44px; text-align: left; flex-shrink: 0; }
  </style>
</head>
<body>
<canvas id="bg-rain-canvas"></canvas>
<div class="layout">
  <div class="top">
    <canvas id="top-rain-canvas"></canvas>

    <div class="col-clock">
      <div id="clock">15:48:22</div>
      <div id="date">QUARTA-FEIRA, 07 MAIO</div>
    </div>

    <div class="col-right">
      <div class="weather-block">
        <div id="weather-description">PARCIALMENTE NUBLADO</div>
        <div class="weather-temp-block">
          <span id="weather-icon" class="mdi mdi-weather-cloudy"></span>
          <span id="weather-now">22°C</span>
        </div>
        <span id="weather-now-day">07-MAI</span>
        <div id="currency-section">
          <div id="usd">USD: R$ 5,68</div>
          <div id="eur">EUR: R$ 6,17</div>
        </div>
      </div>

      <div id="day-chart-wrap">
        <div class="day-row">
          <div class="day-row-name">Qui.</div>
          <span class="day-row-icon mdi mdi-weather-cloudy"></span>
          <div class="day-row-min">18°</div>
          <div class="day-row-bar-wrap"><div class="day-row-bar" style="left:15%;width:55%;background:linear-gradient(to right,#FFD70099,#FFD700)"></div></div>
          <div class="day-row-max">27°</div>
        </div>
        <div class="day-row">
          <div class="day-row-name">Sex.</div>
          <span class="day-row-icon mdi mdi-weather-rainy"></span>
          <div class="day-row-min">17°</div>
          <div class="day-row-bar-wrap"><div class="day-row-bar" style="left:10%;width:45%;background:linear-gradient(to right,#74b9ff99,#74b9ff)"></div></div>
          <div class="day-row-max">23°</div>
        </div>
        <div class="day-row">
          <div class="day-row-name">Sáb.</div>
          <span class="day-row-icon mdi mdi-weather-sunny"></span>
          <div class="day-row-min">19°</div>
          <div class="day-row-bar-wrap"><div class="day-row-bar" style="left:20%;width:60%;background:linear-gradient(to right,#FF8C0099,#FF8C00)"></div></div>
          <div class="day-row-max">31°</div>
        </div>
        <div class="day-row">
          <div class="day-row-name">Dom.</div>
          <span class="day-row-icon mdi mdi-weather-partly-cloudy"></span>
          <div class="day-row-min">20°</div>
          <div class="day-row-bar-wrap"><div class="day-row-bar" style="left:25%;width:50%;background:linear-gradient(to right,#90EE9099,#90EE90)"></div></div>
          <div class="day-row-max">28°</div>
        </div>
        <div class="day-row">
          <div class="day-row-name">Seg.</div>
          <span class="day-row-icon mdi mdi-weather-sunny"></span>
          <div class="day-row-min">21°</div>
          <div class="day-row-bar-wrap"><div class="day-row-bar" style="left:30%;width:58%;background:linear-gradient(to right,#FF8C0099,#FF8C00)"></div></div>
          <div class="day-row-max">32°</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const CLOUDY_KEYWORDS = [
    'nublado','nuvens','nevoeiro','encoberto','overcast',
    'cloudy','clouds','fog','mist','haze','nebuloso',
    'parcialmente nublado','partly cloudy','mostly cloudy',
    'levemente nublado','algumas nuvens','few clouds'
  ];
  function isCloudyCondition(d) {
    const l = d.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return CLOUDY_KEYWORDS.some(k => l.includes(k.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  }
  function updateBackground(desc) {
    if (isCloudyCondition(desc)) {
      document.body.style.backgroundImage = "url('nublado.jpg')";
      document.body.classList.add('cloudy-theme');
    } else {
      document.body.style.backgroundImage = "url('teste2.png')";
      document.body.classList.remove('cloudy-theme');
    }
  }
  const weatherDesc = document.getElementById('weather-description');
  updateBackground(weatherDesc.textContent);
  new MutationObserver(() => updateBackground(weatherDesc.textContent))
    .observe(weatherDesc, { childList:true, characterData:true, subtree:true });
</script>
</body>
</html>
